# Solana tokens and meme coins, traded on-chain through Jupiter. Copy to config.yaml.
mode: paper
venue: solana
symbols: [SOL/USDC, JUP/USDC, BONK/USDC, WIF/USDC]   # quote must be USDC (or all USDT)
timeframe: 5m
starting_cash: 10000
poll_seconds: 60       # free price APIs are rate limited; don't go lower
fee_rate: 0.003        # DEX pool fee + priority fee, roughly
slippage: 0.003

# Any other token: add it by mint address, or write the symbol as "<mint address>/USDC".
token_contracts: {}
#  MYCOIN/USDC: {chain: solana, address: "<mint address>"}

# Automatically watch trending and high-volume Solana pools (meme coins included).
scan:
  enabled: true
  max_symbols: 10
  refresh_minutes: 60

safety:
  min_liquidity_usd: 250000    # meme coins below this are easy to manipulate
  min_volume_24h_usd: 500000
  min_pair_age_days: 7

risk:
  risk_per_trade: 0.005        # meme coins move fast; risk half as much per trade
  max_position_pct: 0.10

solana:
  rpc_url: https://api.mainnet-beta.solana.com   # a free Helius/QuickNode RPC URL is faster and more reliable
  slippage_bps: 100
  max_price_impact: 0.01
  min_sol_balance: 0.02        # SOL always kept for transaction fees
