[project]
name = "cryptobot"
version = "0.1.0"
description = "Risk-managed crypto trading bot with online learning and scam-token screening"
requires-python = ">=3.10"
dependencies = ["ccxt>=4.0", "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "requests>=2.31", "pyyaml>=6.0", "joblib>=1.3", "solders>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cryptobot = "cryptobot.cli:main"

[tool.setuptools]
packages = ["cryptobot"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
