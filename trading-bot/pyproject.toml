[project]
name = "cryptobot"
version = "0.1.0"
description = "Automated paper/live trading bot for Bitcoin and meme coins"
requires-python = ">=3.11"
dependencies = ["ccxt>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cryptobot = "cryptobot.__main__:main"

[tool.setuptools]
packages = ["cryptobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
